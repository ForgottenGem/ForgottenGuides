<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/Favicon.png' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="side-decorations" id="side-decorations"></div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const container = document.getElementById("side-decorations");

  for (let side of ["left", "right"]) {
    for (let i = 0; i < 12; i++) {
      const img = document.createElement("img");

      img.src = "{{ '/assets/images/side-symbol.png' | relative_url }}";

      img.style.width = (35 + Math.random() * 55) + "px";
      img.style.top = (Math.random() * 100) + "%";
      img.style.left = side === "left"
        ? (Math.random() * 18) + "%"
        : (82 + Math.random() * 18) + "%";

      img.style.transform = "rotate(" + (Math.random() * 70 - 35) + "deg)";
      img.style.opacity = (0.30 + Math.random() * 0.50);

      container.appendChild(img);
    }
  }
});
</script>
    <div class="container">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">ForgottenGuides</a></h1>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <span>|</span>
        <a href="{{ '/consoles/' | relative_url }}">Consoles</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>
</body>
</html>
